name: Release

# Builds a Developer ID-signed, Apple-notarized RFGEN44 Firmware Updater DMG and
# publishes it as a GitHub Release. Mirrors RFGEN44-App's release workflow.
# Triggered three ways, as in the sibling apps:
#   1. Push to `main` (i.e. a merged PR) — bumps the latest `vX.Y.Z` tag by
#      $BUMP and releases the merge commit. Skipped when the push changes
#      nothing that ships: only markdown, docs/, LICENSE, .github/ or .vscode/.
#   2. Push a `vX.Y.Z` tag — uses the tag as-is.
#   3. Manual `workflow_dispatch` with a version input — creates the matching
#      `vX.Y.Z` tag at the run's commit. Set `prerelease: true` to keep it out
#      of "latest".
#
# Requires the signing + notary secrets in docs/SIGNING.md; the run
# fails fast without them rather than publishing an unsigned build.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (no leading v). Tag vX.Y.Z is created at this commit.'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a pre-release (so it does not become "latest").'
        required: false
        type: boolean
        default: false

# One release run at a time per ref. Two PRs merging back-to-back queue
# rather than race for the same next-version tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Auto-bump for push-to-main runs: patch | minor | major. Tag pushes and
  # workflow_dispatch use their version verbatim.
  BUMP: patch

jobs:
  # Cheap Linux job: decides whether to release and which version, so a
  # docs-only merge never starts a macOS runner.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.ver.outputs.skip }}
      version: ${{ steps.ver.outputs.value }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version + tag
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1 — no release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          bump() {
            IFS=. read -r MAJOR MINOR PATCH <<< "$1"
            case "$BUMP" in
              major) echo "$((MAJOR + 1)).0.0" ;;
              minor) echo "$MAJOR.$((MINOR + 1)).0" ;;
              *)     echo "$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION#[vV]}"
            if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
              echo "::error::Tag v$V already exists. Push a new tag or pick another version."
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # Push to main. A tag pushed with it releases via its own run.
            if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              skip "HEAD already has a release tag"
            fi
            # Nothing shipped changed? An unknown diff (e.g. force-push) releases.
            if files="$(git diff --name-only "$BEFORE" HEAD 2>/dev/null)" && [ -n "$files" ]; then
              echo "Changed files:"; printf '  %s\n' $files
              shipped=false
              while IFS= read -r f; do
                case "$f" in
                  *.md|docs/*|LICENSE|.github/*|.vscode/*) ;;
                  *) shipped=true; break ;;
                esac
              done <<< "$files"
              [ "$shipped" = true ] || skip "Only docs / CI files changed"
            fi
            LATEST="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            V="$(bump "${LATEST#v}")"
            # No release tag yet: start at 1.0.0, the first version (RFGEN44-App started at 0.1.0).
            [ -n "$LATEST" ] || V="1.0.0"
            while git rev-parse -q --verify "refs/tags/v$V" >/dev/null; do V="$(bump "$V")"; done
          fi

          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$V' is not X.Y.Z"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Releasing v$V"

  release:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check signing secrets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          missing=""
          for s in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see docs/SIGNING.md"
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Select newest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build signed + notarized DMG
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          REQUIRE_NOTARIZATION: '1'
        run: ./scripts/package-signed.sh

      - name: Upload artifact (workflow-scoped, for in-flight inspection)
        uses: actions/upload-artifact@v7
        with:
          name: RFGEN44-FirmwareUpdater-${{ needs.plan.outputs.version }}
          path: |
            dist/RFGEN44-FirmwareUpdater-*.dmg
            dist/RFGEN44-FirmwareUpdater-*.dmg.sha256
          retention-days: 7

      - name: Compose release notes
        env:
          V: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## RFGEN44 Firmware Updater ${V}"
            echo
            echo "macOS app that programs the RFGEN44's PIC16(L)F1459 through a Microchip PICkit 3, using MPLAB IPE."
            echo
            echo "### Install"
            echo
            echo "1. Download \`RFGEN44-FirmwareUpdater-${V}.dmg\` below (macOS 14 or later, Apple silicon or Intel)."
            echo "2. Open the DMG and drag **RFGEN44 Firmware Updater.app** to **Applications**."
            echo "3. Launch it. It is signed with Developer ID and notarized by Apple."
            echo
            echo "It needs **MPLAB X IDE v6.20** (the last version that supports the PICkit 3); see the README."
            echo
            # This version's CHANGELOG section, if there is one.
            notes="$(awk -v h="## ${V}" 'index($0, h " ") == 1 || $0 == h { f = 1; next } /^## / && f { exit } f' CHANGELOG.md)"
            if [ -n "$notes" ]; then
              echo "### Changes"
              echo "$notes"
              echo
            fi
            echo "See the [README](https://github.com/${REPO}#readme)."
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.plan.outputs.version }}
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/RFGEN44-FirmwareUpdater-*.dmg
            dist/RFGEN44-FirmwareUpdater-*.dmg.sha256
